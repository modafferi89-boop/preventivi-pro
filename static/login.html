<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - Preventivi Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <div class="flex items-center justify-center space-x-3 mb-6">
            <span class="bg-blue-600 text-white font-bold px-3.5 py-2 rounded-lg shadow text-xl">P</span>
            <h1 class="text-2xl font-bold text-gray-800">Preventivi Pro</h1>
        </div>

        <p class="text-center text-gray-500 text-sm mb-6">Inserisci le tue credenziali per accedere</p>

        <!-- Box per eventuali messaggi di errore -->
        <div id="error-alert" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4 text-sm" role="alert">
            <span id="error-message"></span>
        </div>

        <form id="login-form" onsubmit="eseguiLogin(event)" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="username">Username</label>
                <input class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" type="text" id="username" required placeholder="Il tuo username">
            </div>

            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Password</label>
                <input class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg transition duration-200 shadow-md cursor-pointer">
                Accedi
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-gray-500">
            Suite Professionale Multi-tenant con Prova Gratuita
        </div>
    </div>

    <script>
        async function eseguiLogin(event) {
            event.preventDefault();
            
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const errorAlert = document.getElementById('error-alert');
            const errorMessage = document.getElementById('error-message');

            errorAlert.classList.add('hidden');

            const formData = new URLSearchParams();
            formData.append('username', usernameInput);
            formData.append('password', passwordInput);

            try {
                let response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData
                });

                let data = await response.json();

                if (response.ok) {
                    // Salva il token usando la chiave 'access_token'
                    localStorage.setItem('access_token', data.access_token);
                    window.location.href = '/';
                } else {
                    errorMessage.innerText = data.detail || "Errore durante il login.";
                    errorAlert.classList.remove('hidden');
                }
            } catch (err) {
                errorMessage.innerText = "Impossibile connettersi al server.";
                errorAlert.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
